<!DOCTYPE html>
<html>
<head>

<title>Grechy Vital Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
    font-size:40px;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    width:250px;
}

.value{
    font-size:50px;
    color:#38bdf8;
}

canvas{
    margin-top:40px;
    max-width:900px;
    background:#1e293b;
    border-radius:20px;
    padding:20px;
}

</style>

</head>

<body>

<h1>Grechy Vital Monitor</h1>

<div class="container">

<div class="card">
<h2>Heart Rate</h2>
<div class="value" id="hr">0</div>
<p>BPM</p>
</div>

<div class="card">
<h2>SpO₂</h2>
<div class="value" id="spo2">0</div>
<p>%</p>
</div>

<div class="card">
<h2>IR Signal</h2>
<div class="value" id="ir">0</div>
</div>

</div>

<canvas id="chart"></canvas>

<script>

const ctx = document.getElementById('chart');

const labels = [];
const hrData = [];
const spo2Data = [];

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: labels,
        datasets: [
            {
                label: 'Heart Rate',
                data: hrData,
                borderWidth: 3
            },
            {
                label: 'SpO2',
                data: spo2Data,
                borderWidth: 3
            }
        ]
    },
    options: {
        responsive: true,
        animation: false
    }
});

async function fetchData()
{
    const response = await fetch('/get_data');

    const data = await response.json();

    document.getElementById('hr').innerText = data.hr;
    document.getElementById('spo2').innerText = data.spo2;
    document.getElementById('ir').innerText = data.ir;

    const time = new Date().toLocaleTimeString();

    labels.push(time);
    hrData.push(data.hr);
    spo2Data.push(data.spo2);

    if(labels.length > 20)
    {
        labels.shift();
        hrData.shift();
        spo2Data.shift();
    }

    chart.update();
}

setInterval(fetchData,1000);

</script>

</body>
</html>
